name: Deploy Frontend

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

env:
  AWS_REGION: us-east-1

jobs:
  # ── 1. Resolve environment ────────────────────────────────────────────────
  resolve-env:
    name: Resolve environment
    runs-on: ubuntu-latest
    outputs:
      env_label: ${{ steps.env.outputs.env_label }}
    steps:
      - name: Set environment variables by branch
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env_label=prod" >> "$GITHUB_OUTPUT"
          else
            echo "env_label=dev" >> "$GITHUB_OUTPUT"
          fi

  # ── 2. Build static site and deploy to S3 + CloudFront ───────────────────
  deploy:
    name: Build & deploy to S3 + CloudFront
    runs-on: ubuntu-latest
    needs: resolve-env
    environment: ${{ needs.resolve-env.outputs.env_label }}
    permissions:
      id-token: write   # required for OIDC
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        working-directory: frontend
        env:
          # NEXT_PUBLIC_* vars are baked into the client bundle at build time.
          # Store these as GitHub Actions secrets scoped to each environment.
          # Names must match frontend/src/lib/constants.ts exactly.
          NEXT_PUBLIC_API_BASE_URL:         ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}
          NEXT_PUBLIC_IMAGES_BUCKET:        ${{ secrets.NEXT_PUBLIC_IMAGES_BUCKET }}
          NEXT_PUBLIC_AWS_REGION:           ${{ env.AWS_REGION }}
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: ${{ secrets.NEXT_PUBLIC_COGNITO_USER_POOL_ID }}
          NEXT_PUBLIC_COGNITO_CLIENT_ID:    ${{ secrets.NEXT_PUBLIC_COGNITO_CLIENT_ID }}
        run: |
          # constants.ts expects the full S3 base URL; build it from the bucket
          # name secret + region (mirrors scripts/setup-develop.sh).
          export NEXT_PUBLIC_IMAGES_BASE_URL="https://${NEXT_PUBLIC_IMAGES_BUCKET}.s3.${NEXT_PUBLIC_AWS_REGION}.amazonaws.com"
          npm run build

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/garden-club-github-${{ needs.resolve-env.outputs.env_label }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Resolve deploy targets
        id: targets
        run: |
          if [[ "${{ needs.resolve-env.outputs.env_label }}" == "prod" ]]; then
            echo "bucket=${{ secrets.S3_BUCKET_PROD }}"                        >> "$GITHUB_OUTPUT"
            echo "distribution=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_PROD }}" >> "$GITHUB_OUTPUT"
          else
            echo "bucket=${{ secrets.S3_BUCKET_DEV }}"                         >> "$GITHUB_OUTPUT"
            echo "distribution=${{ secrets.CLOUDFRONT_DISTRIBUTION_ID_DEV }}"  >> "$GITHUB_OUTPUT"
          fi

      - name: Sync static files to S3
        env:
          S3_BUCKET: ${{ steps.targets.outputs.bucket }}
        run: |
          aws s3 sync frontend/out/ "s3://${S3_BUCKET}" --delete

      - name: Invalidate CloudFront cache
        env:
          DISTRIBUTION_ID: ${{ steps.targets.outputs.distribution }}
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${DISTRIBUTION_ID}" \
            --paths "/*"

      - name: Post deploy summary
        run: |
          echo "## Frontend Deployment"                                                     >> "$GITHUB_STEP_SUMMARY"
          echo ""                                                                           >> "$GITHUB_STEP_SUMMARY"
          echo "**Environment:** \`${{ needs.resolve-env.outputs.env_label }}\`"            >> "$GITHUB_STEP_SUMMARY"
          echo "**S3 bucket:** \`${{ steps.targets.outputs.bucket }}\`"                     >> "$GITHUB_STEP_SUMMARY"
          echo "**CloudFront distribution:** \`${{ steps.targets.outputs.distribution }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo ""                                                                           >> "$GITHUB_STEP_SUMMARY"
          echo "Static site synced to S3 and CloudFront cache invalidated."                 >> "$GITHUB_STEP_SUMMARY"
