name: CI

# PR gate: lint / typecheck / build the frontend and validate / compile / test
# the backend before anything merges. The deploy-* workflows only run after a
# merge, so without this a broken PR is first discovered by a failed deploy.
on:
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Path filtering is done per job rather than with workflow-level `paths:`.
  # A workflow skipped by `paths:` never reports a status, so a required check
  # would sit "pending" forever on a docs-only PR; a job skipped by `if:`
  # reports success and keeps branch protection satisfied.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/ci.yml'
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'

  frontend:
    name: frontend
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Unit tests
        working-directory: frontend
        run: npm test -- --ci

      - name: Build static export
        working-directory: frontend
        env:
          # Dummy values: NEXT_PUBLIC_* are baked in at build time and the
          # static export needs them defined, but CI never talks to AWS.
          NEXT_PUBLIC_API_BASE_URL: https://api.example.invalid
          NEXT_PUBLIC_IMAGES_BASE_URL: https://images.example.invalid
          NEXT_PUBLIC_AWS_REGION: us-east-1
          NEXT_PUBLIC_COGNITO_USER_POOL_ID: us-east-1_ci000000
          NEXT_PUBLIC_COGNITO_CLIENT_ID: ci-dummy-client-id
        run: npm run build

  backend:
    name: backend
    needs: changes
    if: needs.changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Set up SAM CLI
        uses: aws-actions/setup-sam@v2
        with:
          use-installer: true

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Validate SAM template
        working-directory: backend
        # --lint runs cfn-lint; no AWS credentials are needed for either.
        run: sam validate --lint --region us-east-1

      - name: Compile Lambda sources
        run: python -m compileall -q backend/functions

      - name: Run tests
        working-directory: backend
        run: |
          if [ -d tests ]; then
            python -m pytest
          else
            echo "No backend/tests yet; skipping pytest."
          fi
