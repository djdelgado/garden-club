[pytest]
testpaths = tests
# tests/ is on sys.path so `from conftest import api_event` resolves, and the
# handler modules (loaded by path in conftest) can find their own siblings.
# layers/common/python mirrors the CommonLayer's /opt/python mount, so handlers
# can `from gardenclub_common import ...` exactly as they do in Lambda.
pythonpath = tests layers/common/python
addopts = -q --strict-markers
