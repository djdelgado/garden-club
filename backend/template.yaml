AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: Garden Club Web Application - SAM Template

Parameters:
  Stage:
    Type: String
    Default: local
    Description: Environment stage (local, dev, prod)
  CorsOrigins:
    Type: CommaDelimitedList
    Default: "http://localhost:3000"
    Description: Comma-separated list of allowed CORS origins for API Gateway and S3
  LocalstackEndpoint:
    Type: String
    Default: ''
    Description: LocalStack endpoint (local only)
  S3PublicEndpoint:
    Type: String
    Default: ''
    Description: Public S3 endpoint for presigned URLs (localhost:4566 for local, empty for AWS)

Globals:
  Function:
    Timeout: 30
    MemorySize: 256
    Runtime: python3.12
    Environment:
      Variables:
        EVENTS_TABLE_NAME: !Ref EventsTable
        IMAGES_TABLE_NAME: !Ref ImagesTable
        MEMBERS_TABLE_NAME: !Ref MembersTable
        IMAGES_BUCKET_NAME: !Ref ImagesBucket
        USER_POOL_ID: !Ref GardenClubUserPool
        POWERTOOLS_SERVICE_NAME: GardenClub
        LOG_LEVEL: INFO
        LOCALSTACK_ENDPOINT: !Ref LocalstackEndpoint
        S3_PUBLIC_ENDPOINT: !Ref S3PublicEndpoint

Resources:
  # Cognito User Pool
  GardenClubUserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: !Sub 'GardenClubUserPool-${Stage}'
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireUppercase: false
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
      AutoVerifiedAttributes:
        - email
      # Server-side half of the invite flow: only admins create users, and the
      # invite email carries the temporary password.
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
        InviteMessageTemplate:
          EmailSubject: "You're invited to Garden Club"
          EmailMessage: "Welcome to Garden Club! Your username is {username} and your temporary password is {####}. Sign in to complete your profile."
      Schema:
        - Name: email
          AttributeDataType: String
          Mutable: true
          Required: true
      # NOTE: the app client declares no explicit Read/WriteAttributes, so the
      # standard `name` attribute flows into the token on first sign-in. If anyone
      # adds those lists, `name` MUST be included or the directory silently stops
      # populating display names.

  GardenClubUserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub 'GardenClubAppClient-${Stage}'
      UserPoolId: !Ref GardenClubUserPool
      ExplicitAuthFlows:
        - ALLOW_USER_SRP_AUTH
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: LEGACY

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      UserPoolId: !Ref GardenClubUserPool
      Description: Admin users group

  # DynamoDB Tables
  EventsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'GardenClubEvents-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: eventId
          AttributeType: S
        - AttributeName: startTime
          AttributeType: S
      KeySchema:
        - AttributeName: eventId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: StartTimeIndex
          KeySchema:
            - AttributeName: startTime
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  ImagesTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'GardenClubImages-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: imageId
          AttributeType: S
        - AttributeName: folderName
          AttributeType: S
      KeySchema:
        - AttributeName: imageId
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: FolderNameIndex
          KeySchema:
            - AttributeName: folderName
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  MembersTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub 'GardenClubMembers-${Stage}'
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: memberId
          AttributeType: S
        - AttributeName: cognitoSub
          AttributeType: S
        - AttributeName: emailLower
          AttributeType: S
      KeySchema:
        - AttributeName: memberId
          KeyType: HASH
      GlobalSecondaryIndexes:
        # Resolves /members/me from the token sub without a scan.
        - IndexName: CognitoSubIndex
          KeySchema:
            - AttributeName: cognitoSub
              KeyType: HASH
          Projection:
            ProjectionType: ALL
        # Case-insensitive duplicate-email checks (replaces a scan filter).
        - IndexName: EmailIndex
          KeySchema:
            - AttributeName: emailLower
              KeyType: HASH
          Projection:
            ProjectionType: ALL

  # S3 Bucket
  ImagesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub 'garden-club-images-${AWS::AccountId}-${Stage}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Enabled
      CorsConfiguration:
        CorsRules:
          - AllowedOrigins: !Ref CorsOrigins
            AllowedMethods:
              - PUT
              - POST
              - GET
            AllowedHeaders:
              - '*'
            MaxAge: 3000

  # API Gateway HTTP API
  GardenClubApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      StageName: !Ref Stage
      # ⚠️ DefaultAuthorizer authenticates EVERY route on this API (/events,
      # /images/*, /upload/*, /members/*). Callers must send the Cognito **ID**
      # token — `audience` is the app client id, and access tokens carry `client_id`
      # rather than `aud`, so they 401. CORS preflight is unaffected (HTTP API
      # answers OPTIONS before authorization).
      Auth:
        Authorizers:
          CognitoJwtAuthorizer:
            IdentitySource: "$request.header.Authorization"
            # JwtConfiguration is an OpenAPI passthrough — its keys are lowercase,
            # unlike every other SAM property.
            JwtConfiguration:
              issuer: !Sub 'https://cognito-idp.${AWS::Region}.amazonaws.com/${GardenClubUserPool}'
              audience:
                - !Ref GardenClubUserPoolClient
        DefaultAuthorizer: CognitoJwtAuthorizer
      CorsConfiguration:
        AllowOrigins: !Ref CorsOrigins
        AllowHeaders:
          - Authorization
          - Content-Type
          - X-Amz-Date
          - X-Api-Key
          - X-Amz-Security-Token
        AllowMethods:
          - GET
          - POST
          - PUT
          - DELETE
          - OPTIONS
        MaxAge: 300

  # Lambda Execution Roles
  EventsLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt EventsTable.Arn
                  - !Sub '${EventsTable.Arn}/index/*'

  MembersLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAndCognitoAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:DeleteItem
                  - dynamodb:Query
                  - dynamodb:Scan
                Resource:
                  - !GetAtt MembersTable.Arn
                  - !Sub '${MembersTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminDeleteUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminUpdateUserAttributes
                  - cognito-idp:AdminAddUserToGroup
                  - cognito-idp:AdminRemoveUserFromGroup
                  - cognito-idp:ListUsers
                Resource: !GetAtt GardenClubUserPool.Arn
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub '${ImagesBucket.Arn}/members/*'
              # ListBucket (needed to enumerate a member's prefix on delete) is a
              # bucket-level action; scope it to the members/ prefix.
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource: !GetAtt ImagesBucket.Arn
                Condition:
                  StringLike:
                    s3:prefix:
                      - 'members/*'

  ImagesLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: DynamoDBAndS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                Resource:
                  - !GetAtt ImagesTable.Arn
                  - !Sub '${ImagesTable.Arn}/index/*'
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:DeleteObject
                Resource: !Sub ${ImagesBucket.Arn}/*

  UploadLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
      Policies:
        - PolicyName: S3PresignedUrlAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                Resource: !Sub ${ImagesBucket.Arn}/*
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:UpdateItem
                  - dynamodb:Query
                Resource:
                  - !GetAtt ImagesTable.Arn
                  - !Sub '${ImagesTable.Arn}/index/*'

  # Lambda Functions
  EventsFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'GardenClubEventsFunction-${Stage}'
      CodeUri: functions/events/
      Handler: handler.lambda_handler
      Role: !GetAtt EventsLambdaRole.Arn
      Events:
        GetEvents:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /events
            Method: GET
        GetEventById:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /events/{id}
            Method: GET
        CreateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /events
            Method: POST
        UpdateEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /events/{id}
            Method: PUT
        DeleteEvent:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /events/{id}
            Method: DELETE

  MembersFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'GardenClubMembersFunction-${Stage}'
      CodeUri: functions/members/
      Handler: handler.lambda_handler
      Role: !GetAtt MembersLambdaRole.Arn
      Events:
        GetMembers:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /members
            Method: GET
        GetMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /members/me
            Method: GET
        UpdateMe:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /members/me
            Method: PUT
        PresignMemberPhoto:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /members/me/photo
            Method: POST
        CreateMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /members
            Method: POST
        UpdateMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /members/{memberId}
            Method: PUT
        DeleteMember:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /members/{memberId}
            Method: DELETE
        ResendInvite:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /members/{memberId}/resend-invite
            Method: POST

  ImagesFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'GardenClubImagesFunction-${Stage}'
      CodeUri: functions/images/
      Handler: handler.lambda_handler
      Role: !GetAtt ImagesLambdaRole.Arn
      Events:
        GetImages:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /images
            Method: GET
        GetFolders:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /images/folders
            Method: GET
        UpdateFolder:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /images/folders/{folderName}
            Method: PUT
        DeleteFolder:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /images/folders/{folderName}
            Method: DELETE
        DeleteImage:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /images/{imageId}
            Method: DELETE

  UploadFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub 'GardenClubUploadFunction-${Stage}'
      CodeUri: functions/upload/
      Handler: handler.lambda_handler
      Role: !GetAtt UploadLambdaRole.Arn
      Events:
        PresignUrl:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /upload/presign
            Method: POST
        CompleteUpload:
          Type: HttpApi
          Properties:
            ApiId: !Ref GardenClubApi
            Path: /upload/complete
            Method: POST

Outputs:
  ApiUrl:
    Description: API Gateway endpoint URL
    Value: !Sub https://${GardenClubApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}
  UserPoolId:
    Description: Cognito User Pool ID
    Value: !Ref GardenClubUserPool
  UserPoolClientId:
    Description: Cognito User Pool Client ID
    Value: !Ref GardenClubUserPoolClient
  ImagesBucketName:
    Description: S3 Images Bucket Name
    Value: !Ref ImagesBucket